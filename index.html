const TPL={atk:[1,2,3,4],def:[1,2,3,4],pow:[2,3,4,5],mod:[1,2,3,4]};
const DKN=16,DKP=TY.reduce((a,t)=>a+TPL[t].reduce((x,y)=>x+y,0),0)+neus().reduce((a,c)=>a+c.p,0);
const okDk=d=>Array.isArray(d)&&d.length==4&&d.every(n=>Number.isInteger(n)&&n>=0&&n<=DKN)&&d.reduce((a,b)=>a+b,0)==DKN;

function customDeck(dk){
  const left={};TY.forEach(t=>left[t]=[...TPL[t]]);
  const out=E.map(()=>[]),need=[...dk];
  const spread=l=>{const s=[...l].sort((a,b)=>b-a),o=[];while(s.length){o.push(s.shift());if(s.length)o.push(s.pop())}return o};
  E.forEach((e,i)=>{const t=SIG[e];spread(left[t]).slice(0,need[i]).forEach(p=>{out[i].push([t,p]);left[t].splice(left[t].indexOf(p),1);need[i]--})});
  const rest=TY.flatMap(t=>left[t].map(p=>[t,p])).sort((a,b)=>b[1]-a[1]||TY.indexOf(a[0])-TY.indexOf(b[0]));
  const act=E.map((_,i)=>i).filter(i=>need[i]>0).sort((a,b)=>need[b]-need[a]||a-b);
  for(let pass=0;rest.length;pass++)(pass%2?[...act].reverse():act).forEach(i=>{if(need[i]>0&&rest.length){out[i].push(rest.shift());need[i]--}});
  const deck=[];
  out.forEach((cs,i)=>{let k=0;cs.sort((a,b)=>a[1]-b[1]).forEach(([t,p])=>{const c=mk(E[i],t,p);if(t=='mod')c.mv=MV[(i+k++)%7];deck.push(c)})});
  return [...deck,...neus()];

      body=`<h2>Round ${rom(s.r+1)} cards are down</h2><p class="m">All 3 slots are played. Next, place your tokens on any card you have played, this round or earlier. Nothing is final until the trial ends.</p><button class="btn" data-a="tok">Place tokens</button>`;
    }else if(s.duel&&s.wait){
      body=`<h2>Card sealed</h2><p class="m">Waiting for your opponent to choose. Both cards reveal together.</p><button class="btn alt" data-a="dleave">Leave duel</button>`;
    }else{
      const dirUI=s.pick&&s.pick.mv=='shift'?`<div class="pick dirs"><button data-a="dir" data-v="-1" class="${s.dir<0?'on':''}">← Previous slot</button><button data-a="dir" data-v="1" class="${s.dir>0?'on':''}">Next slot →</button></div>`:'';
      body=`<h2>Slot ${rom(s.k+1)} of III</h2><p class="m">Pick a card, then press Play card. You and your foe reveal together.</p>
      <div class="hand">${sortC([...s.hand]).map(c=>card(c,s.pick==c?' sel':'',`data-a="pick" data-v="${c.id}"`)).join('')}</div>
      ${dirUI}<button class="btn" data-a="go" ${s.pick?'':'disabled'}>Play card</button>
      <p class="m">${s.pile.length} cards left in your draw pile</p>${LEG}`;
    }
    $.innerHTML=`${head}${s.bg&&s.r==0&&s.k==0?`<p class="m">${s.bg}</p>`:''}<h1>Round ${rom(s.r+1)} of III</h1>${s.view.length?`<div>${pastH(s.view)}</div>`:''}${s.rows.map(r=>rowH(r)).join('')}${body}`;return;
  }
  if(s.ph=='matchend'){s.allc=1;
    $.innerHTML=`${head}<h1 class="${s.win?'w':'l'}">${s.win?'Match won':'Match lost'}</h1><p>Rounds ${s.rw}–${s.rl}, total power margin ${s.mp>0?'+':''}${s.mp}.</p>
    <p class="m">Coins: ${s.c0} before the bet, ${s.coins} now (${s.coins-s.c0>=0?'+':''}${s.coins-s.c0}).</p>
    <h2>Final board</h2><p class="m">Review the match. Tap a clash to see how its score was built.</p>${pastH(s.view)}<button class="btn" data-a="${s.m<3?'trade':'end'}">${s.m<3?'Go to trade':'See results'}</button>`;return;
  }
  if(s.ph=='trade'){
    const t=s.tr,done=t.i>=t.n;let left=0;for(let k=t.i;k<t.n&&t.order[k]=='P';k++)left++;
    $.innerHTML=`${head}<h1>Trade</h1><p class="m">Each side puts up ${t.n/2} card${t.n>2?'s':''}, chosen at random from the cards they played. ${s.win?'You pick':'Your foe picks'} first: ${t.N} card${t.N>1?'s':''} (the round difference, at least 1). Then picks alternate until the pool is empty, and each side ends with ${t.n/2} cards.</p>
    <p><b>${done?'Trade complete.':`Pick ${left} card${left>1?'s':''}`}</b></p>
    <div class="pool">${t.pool.map(x=>card(x.c,(x.by?' gone':'')+' tag',`data-a="tp" data-v="${x.c.id}" data-t="${x.by=='p'?'yours':x.by=='o'?'theirs':x.mine?'from you':'from them'}"`)).join('')}</div>
    ${s.bg?`<p class="m">${s.bg}</p>`:''}${done?`<button class="btn" data-a="nm">Begin Trial ${rom(s.m+2)}</button>`:''}`;return;
  }
  if(s.ph=='end'){
    const cnt=[...E,'neu'].map(e=>`${IC[e]} ${s.deck.filter(c=>c.e==e).length}`).join('  ');
    $.innerHTML=`<h1>${s.broke?'Ruined':'Run complete'}</h1>${s.broke?'<p>You could not cover the wager, and your run ends here.</p>':''}<p>You won ${s.wins} of 4 matches.</p><p class="m">Coins: ${s.coins} · Final deck: ${s.deck.length} cards, ${cnt} · total power ${s.deck.reduce((a,c)=>a+c.p,0)}</p>
    <button class="btn" data-a="again">Play again</button>`;
  }
}
let AC=null,MUTE=false;
const au=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}return AC};
const tn=(f,d,ty='square',v=.05,t0=0,f2)=>{if(MUTE)return;const c=au();if(!c)return;const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)};
const nz=(d,v=.06,t0=0,f0=3000,f1=300)=>{if(MUTE)return;const c=au();if(!c)return;const n=c.sampleRate*d|0,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+t0;s.buffer=b;fl.type='bandpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(c.destination);s.start(t)};
const SFX={tick:()=>tn(660,.05,'square',.035),play:()=>{tn(150,.14,'square',.07,0,60);nz(.08,.04,0,1200,200)},place:()=>{tn(520,.05,'square',.04);tn(780,.07,'square',.04,.05)},coin:()=>{tn(988,.07,'square',.04);tn(1319,.18,'square',.04,.07)},burn:()=>nz(.35,.09,0,2500,200),ward:()=>{tn(880,.1,'triangle',.07);tn(1320,.2,'triangle',.06,.08)},grow:()=>[392,494,587].forEach((f,i)=>tn(f,.1,'triangle',.06,i*.07)),air:()=>nz(.3,.05,0,400,2500),syn:()=>{tn(1046,.08,'square',.035);tn(1568,.15,'square',.035,.08)},reveal:()=>{tn(220,.15,'sawtooth',.04);tn(330,.2,'sawtooth',.04,.1)},win:()=>[523,659,784,1046].forEach((f,i)=>tn(f,.16,'square',.05,i*.12)),lose:()=>[392,330,262,196].forEach((f,i)=>tn(f,.2,'triangle',.07,i*.14))};
const sfx=k=>{try{SFX[k]()}catch(e){}};
const SM={start:'coin',pick:'tick',dir:'tick',tsel:'tick',wel:'tick',trow:'place',trem:'tick',tconfirm:'reveal',go:'play',begin:'coin',bet:'tick',sell:'coin',dotrade:'coin',buyback:'coin',tp:'place',buysel:'tick',givesel:'tick',stok:'place',srow:'place',tok:'tick',fxnext:'tick',trade:'tick',nm:'tick',shop0:'tick',brk:'tick',leave:'tick',sskip:'tick',astok:'tick',arow:'place',aconf:'place',areset:'tick',adone:'tick'};
document.getElementById('mute').onclick=function(){MUTE=!MUTE;this.textContent='Sound: '+(MUTE?'off':'on');if(!MUTE)sfx('tick')};
const tip=document.getElementById('tip');let tt=null;
const showTip=(el,x,y)=>{tip.textContent=el.dataset.tip;tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(6,Math.min(innerWidth-w-6,x-w/2))+'px';tip.style.top=(y-h-16<6?y+22:y-h-16)+'px'};
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.style.display='none'});
document.addEventListener('touchstart',e=>{const el=e.target.closest('[data-tip]');clearTimeout(tt);if(el){const t=e.touches[0];tt=setTimeout(()=>{showTip(el,t.clientX,t.clientY-30);setTimeout(()=>tip.style.display='none',2800)},450)}},{passive:true});

$.onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a!='go')S.fresh=0;sfx(SM[a]);tip.style.display='none';
  if(duelClick(a,v)){}
  else if(a=='start')start(v);
  else if(a=='elsel'){S.sel=S.sel==v?null:v;render();const p=document.querySelector('.epanel');if(p)p.scrollIntoView({behavior:'smooth',block:'nearest'})}
  else if(a=='how'){S.how=!S.how;render()}
  else if(a=='jump'){const h=document.getElementById('pickel');if(h)h.scrollIntoView({behavior:'smooth'})}
  else if(a=='pick'){S.pick=S.pick&&S.pick.id==+v?null:S.hand.find(c=>c.id==+v);S.dir=1;render()}
  else if(a=='dir'){S.dir=+v;render()}
  else if(a=='tsel')selTok(+v);
  else if(a=='wel'){S.fx.wel=v;render()}
  else if(a=='trow')placeTok(+v);
  else if(a=='trem')remTok(+v);
  else if(a=='tconfirm')confirmTok();
  else if(a=='go')playSlot();
  else if(a=='begin'){S.bet=Math.max(1,Math.min(S.bet,S.coins));const pw=d=>d.reduce((x,c)=>x+c.p,0)/d.length,cap=S.lv==0?5:Math.max(1,Math.min(5,Math.round(1.5+S.lv+(pw(S.opp)/pw(S.deck)-1)*6)));
    if(S.ph=='pre'&&S.bet>cap){S.bet=cap;S.note='Your foe will only wager '+cap+'. Press again to accept.';render()}else{S.note='';beginMatch()}}
  else if(a=='shop0')openShop('pre');
  else if(a=='buysel'){S.sbuy=S.sbuy==+v?null:+v;render()}
  else if(a=='givesel'){S.sgive=S.sgive==+v?null:+v;render()}
  else if(a=='dotrade')doTrade();
  else if(a=='buyback')buyBack(+v);
  else if(a=='leave'){S.ph=S.back=='pre'?'pre':'play';render()}
  else if(a=='sell')sell(+v);
  else if(a=='bust'){S.broke=true;S.ph='end';render()}
  else if(a=='tok'){commitRound();startFx()}
  else if(a=='fxnext'){S.open={};if(S.r<2){const n0=S.T.p.length+S.T.o.length;[...S.T.p,...S.T.o].forEach(t=>{t.nw=0;t.mvd=0});growT(S.T,S.allrows.length);S.view=paint(S.allrows,{p:S.T.p.map(t=>({...t})),o:S.T.o.map(t=>({...t}))});if(S.T.p.length+S.T.o.length>n0)setTimeout(()=>sfx('grow'),200);S.r++;newRound();S.ph='play';render()}else if(S.duel)endDuel();else endMatch()}
  else if(a=='stok'){const P=S.sp,g=P.list[P.i];if(g.k=='fire')spNext({sd:'p',k:'fire',at:g.at,id:+v});else if(g.k=='burn')spNext({sd:'p',k:'burn',at:g.at,idx:g.idx,id:+v});else{const t0=P.T.o.find(x=>x.id==+v);if(!(g.k=='ag'&&t0&&t0.e=='earth')){P.tok=+v;render()}}}
  else if(a=='sauto'){const P=S.sp;P.list=P.list.filter((q,j)=>j<P.i||(j>P.i&&q.k!='burn'));P.tok=null;if(P.i>=P.list.length)submitMoves(P.ch);else render()}
  else if(a=='srow'){const P=S.sp,g=P.list[P.i];
    if(g.k=='earth')spNext({sd:'p',k:'earth',at:g.at,to:+v});
    else if(g.k=='wn'){const to=+v;if(Math.abs(to-g.at)==1&&(to/3|0)==(g.at/3|0))spNext({sd:'p',k:'wn',at:g.at,to})}
    else{const own=g.k=='am',t=(own?P.T.p:P.T.o).find(x=>x.id==P.tok);
      if(t&&t.row!=+v&&!(g.k=='ag'&&t.e=='earth')&&!forbid(S.allrows,own?'p':'o',t.e,+v))spNext({sd:'p',k:g.k,at:g.at,id:t.id,to:+v})}}
  else if(a=='astok'){const A=S.sp.air;A.sel=A.sel==+v?null:+v;render()}
  else if(a=='arow'){const A=S.sp.air;if(A.sel!=null){const t=S.sp.T.p.find(x=>x.id==A.sel),from=A.mv[t.id]!=null?A.mv[t.id]:t.row,to=+v,n=S.sp.T.p.filter(x=>(A.mv[x.id]!=null?A.mv[x.id]:x.row)==to).length;if(to!=from&&n<MAXT){if(to==t.row)delete A.mv[t.id];else A.mv[t.id]=to;A.sel=null}}render()}
  else if(a=='areset'){const A=S.sp.air;A.mv={};A.sel=null;render()}
  else if(a=='adone'){const P=S.sp;Object.entries(P.air.mv).forEach(([id,to])=>P.ch.push({sd:'p',k:'am',at:P.T.p.find(t=>t.id==+id).row,id:+id,to}));P.air=null;P.i=0;if(P.pre){S.sp=null;sendPlace(P.ch)}else if(!P.list.length)submitMoves(P.ch);else render()}
  else if(a=='sskip')spNext(null);
  
  else if(a=='brk'){S.open=S.open||{};S.open[+v]=!S.open[+v];render()}
  else if(a=='bet'){S.bet=+v;S.note='';render()}
  else if(a=='trade')buildTrade();
  else if(a=='tp')tradePick(+v);
  else if(a=='nm')nextMatch();
  else if(a=='end'){S.ph='end';render()}
  else if(a=='again'){S={ph:'home'};render()}
};
